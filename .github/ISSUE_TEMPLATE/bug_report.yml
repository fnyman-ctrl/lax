name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Don't include real personal data.** No screenshots of your own activity,
        captured text or database files. Use synthetic examples.

        Found a security or privacy problem? Don't file it here. See SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: And what did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: >-
        In Lax, open **Models** and press **Copy details for a bug report**, then
        paste here. It holds versions, your Mac, the models and counts, nothing
        Lax has read. If you can't, give the Lax version, macOS version, Mac
        model and memory, and the model setup.
      render: text
