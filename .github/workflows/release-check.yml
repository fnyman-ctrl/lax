name: Release check

# Builds Lax.app the way users do (npm run build:app) from a release tag,
# so a broken bundle is caught before anyone builds the release. Nothing is
# published: Lax 0.1 is built from source (docs/RELEASING.md).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

jobs:
  build-app:
    name: Build Lax.app
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # No cache in a release build: nothing from an earlier run gets in.
          package-manager-cache: false

      - name: Install Rust toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install

      - name: The version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          want="${TAG#v}"
          npm_version="$(node -p 'require("./package.json").version')"
          tauri_version="$(node -p 'require("./src-tauri/tauri.conf.json").version')"
          cargo_version="$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -n 1)"
          for v in "$npm_version" "$tauri_version" "$cargo_version"; do
            if [ "$v" != "$want" ]; then
              echo "Versions: package.json $npm_version, tauri.conf.json $tauri_version, Cargo.toml $cargo_version; tag $TAG"
              exit 1
            fi
          done

      - name: Build and install as a user would
        run: npm run build:app

      - name: Check the app
        run: |
          app="$HOME/Applications/Lax.app"
          test -x "$app/Contents/MacOS/lax"
          codesign --verify --deep --strict "$app"
          codesign -dv "$app" 2>&1 | grep -q "Identifier=io.github.fnyman-ctrl.lax"
          # SQLCipher is built on Apple's CommonCrypto, not OpenSSL, with
          # its own logging compiled out, and its licence ships with the app
          # (ADR 0010). grep without -q reads all its input, so the check
          # holds with pipefail too.
          bin="$app/Contents/MacOS/lax"
          if ! nm -u "$bin" | grep -x "_CCCryptorCreate" >/dev/null; then
            echo "Lax.app doesn't use CommonCrypto; SQLCipher must"
            exit 1
          fi
          if otool -L "$bin" | grep -E "libcrypto|libssl" >/dev/null; then
            echo "Lax.app links OpenSSL; SQLCipher must use CommonCrypto"
            exit 1
          fi
          # A message only SQLCipher's logging has.
          if strings "$bin" | grep "sqlcipher_set_log" >/dev/null; then
            echo "SQLCipher's own logging is compiled in"
            exit 1
          fi
          if nm -u "$bin" | grep "os_log" >/dev/null; then
            echo "Lax.app can write to the unified log, outside logging.rs"
            exit 1
          fi
          test -f "$app/Contents/Resources/licenses/SQLCipher.txt"
          du -sh "$app"
