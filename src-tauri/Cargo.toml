[package]
name = "lax"
version = "0.1.0"
description = "A private, fully local memory for your Mac"
license = "AGPL-3.0-only"
repository = "https://github.com/fnyman-ctrl/lax"
edition = "2024"
# The oldest Rust that builds Lax: Tauri needs 1.90 (checked with
# `cargo +1.90 check --locked`).
rust-version = "1.90"
publish = false

[lib]
# The `_lib` suffix avoids a name clash between the lib and bin targets on Windows,
# see https://github.com/rust-lang/cargo/issues/8519
name = "lax_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api: a transparent window for the writing assistant's panel,
# so the salmon can swim in (ADR 0009). Lax isn't sold through the App Store.
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
# Local time for pause deadlines ("until tomorrow") and the menu label.
# Already in the dependency tree through Tauri.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Pattern matching for secret redaction. Already in the dependency tree through Tauri.
regex = "1"
# Local storage. SQLite is compiled in, so the version and FTS5 are known.
# See docs/adr/0006-sqlite-with-rusqlite.md. It is SQLCipher's SQLite, built
# on Apple's CommonCrypto, not OpenSSL (ADR 0010); its own logging is
# compiled out in .cargo/config.toml.
rusqlite = { version = "0.40", features = ["bundled-sqlcipher"] }
# Parsing browser addresses so only the host is kept. Already in the
# dependency tree through Tauri.
url = "2"
# Turning what the window shows into JSON for the web UI. Already in the
# dependency tree through Tauri.
serde = { version = "1", features = ["derive"] }
# Calls to OpenAI-compatible model servers (ADR 0004, ADR 0007). Already in
# Cargo.lock through Tauri; TLS through macOS's own Security framework.
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls"] }
serde_json = "1"
# Waiting between retries of a model call, and taking turns at the model.
# Already in the dependency tree through Tauri, which runs on it with both
# features on.
tokio = { version = "1", features = ["time", "sync"] }
# Clearing Lax's own copies of the database key from memory (ADR 0010).
# Already in Cargo.lock through reqwest.
zeroize = "1"

[dev-dependencies]
# Async tests for the model client.
tokio = { version = "1", features = ["macros", "rt"] }

# Reading other apps' windows through the Accessibility API (capture, #6).
# All already in the dependency tree through Tauri; only the features used
# are turned on.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
# NSApplication, NSOpenPanel and its parents: the folder picker for
# exporting the memory pages, so the web UI never hands Lax a path to write
# to (ADR 0011).
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "libc", "block2", "NSApplication", "NSEvent", "NSGlassEffectView", "NSGraphics", "NSOpenPanel", "NSPanel", "NSPasteboard", "NSPasteboardItem", "NSResponder", "NSRunningApplication", "NSSavePanel", "NSView", "NSWindow", "NSWorkspace"] }
# Blocks for AppKit's event monitor (the writing assistant, ADR 0009).
block2 = "0.6"
# CFData for the database key item and the code hash (ADR 0010). Already
# turned on in the tree by Tauri's own dependencies.
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFArray", "CFData", "CFDictionary", "CFNumber", "CFString", "CFURL"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData", "NSGeometry", "NSProcessInfo", "NSString", "NSPathUtilities"] }
# Free disk space before converting the database to an encrypted copy
# (statvfs, ADR 0010). Already in Cargo.lock through Tauri and others.
libc = "0.2"
# The database key in the login keychain, and its random bytes (ADR 0010).
# Already in Cargo.lock through reqwest's native-tls; no features needed.
security-framework = { version = "3", default-features = false }

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
# All output goes through src/logging.rs, which can't carry captured content
# (GUARDRAILS §6). No printing or debug dumps anywhere else.
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"

# See https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
