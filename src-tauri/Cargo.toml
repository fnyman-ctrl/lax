[package]
name = "lax"
version = "0.1.0"
description = "A private, fully local memory for your Mac"
license = "AGPL-3.0-only"
repository = "https://github.com/fnyman-ctrl/lax"
edition = "2024"
publish = false

[lib]
# The `_lib` suffix avoids a name clash between the lib and bin targets on Windows,
# see https://github.com/rust-lang/cargo/issues/8519
name = "lax_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api: a transparent window for the writing assistant's panel,
# so the salmon can swim in (ADR 0009). Lax isn't sold through the App Store.
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
# Local time for pause deadlines ("until tomorrow") and the menu label.
# Already in the dependency tree through Tauri.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Pattern matching for secret redaction. Already in the dependency tree through Tauri.
regex = "1"
# Local storage. SQLite is compiled in, so the version and FTS5 are known.
# See docs/adr/0006-sqlite-with-rusqlite.md.
rusqlite = { version = "0.40", features = ["bundled"] }
# Parsing browser addresses so only the host is kept. Already in the
# dependency tree through Tauri.
url = "2"
# Turning what the window shows into JSON for the web UI. Already in the
# dependency tree through Tauri.
serde = { version = "1", features = ["derive"] }
# Calls to OpenAI-compatible model servers (ADR 0004, ADR 0007). Already in
# Cargo.lock through Tauri; TLS through macOS's own Security framework.
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls"] }
serde_json = "1"
# Waiting between retries of a model call, and taking turns at the model.
# Already in the dependency tree through Tauri, which runs on it with both
# features on.
tokio = { version = "1", features = ["time", "sync"] }

[dev-dependencies]
# Async tests for the model client.
tokio = { version = "1", features = ["macros", "rt"] }

# Reading other apps' windows through the Accessibility API (capture, #6).
# All already in the dependency tree through Tauri; only the features used
# are turned on.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "libc", "block2", "NSEvent", "NSPasteboard", "NSPasteboardItem", "NSRunningApplication", "NSWorkspace"] }
# Blocks for AppKit's event monitor (the writing assistant, ADR 0009).
block2 = "0.6"
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFArray", "CFDictionary", "CFNumber", "CFString", "CFURL"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData", "NSString", "NSPathUtilities"] }

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
# All output goes through src/logging.rs, which can't carry captured content
# (GUARDRAILS §6). No printing or debug dumps anywhere else.
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"

# See https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
