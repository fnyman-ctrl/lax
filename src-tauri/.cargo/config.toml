[env]
# SQLCipher's own logging would go to the macOS unified log, outside
# src/logging.rs (GUARDRAILS §6). Compiled out, so it can never log: a pragma
# can't do it reliably, because the log target is set process-wide at the
# first open. SQLCIPHER_OMIT_LOG removes its log messages;
# SQLCIPHER_OMIT_LOG_DEVICE also removes the unified log as a target, which
# `PRAGMA cipher_profile` could otherwise send every statement to. Forced, so
# a LIBSQLITE3_FLAGS in the environment can't replace it. ADR 0010.
LIBSQLITE3_FLAGS = { value = "-DSQLCIPHER_OMIT_LOG -DSQLCIPHER_OMIT_LOG_DEVICE", force = true }
